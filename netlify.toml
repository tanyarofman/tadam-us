[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/brand/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# The site used to have an English copy under /en/; it is English-only at the root now.
[[redirects]]
  from = "/eretz-nehederet-demo"
  to = "https://heytadam.com/eretz-nehederet-demo"
  status = 302
  force = true

[[redirects]]
  from = "/eretz-nehederet-demo/"
  to = "https://heytadam.com/eretz-nehederet-demo"
  status = 302
  force = true

[[redirects]]
  from = "/en"
  to = "/"
  status = 301

[[redirects]]
  from = "/en/*"
  to = "/:splat"
  status = 301

# Blog articles removed or renamed for the US site (2026-11-24).
[[redirects]]
  from = "/blog/hanukkah-riddles"
  to = "/blog/"
  status = 301

[[redirects]]
  from = "/blog/tu-bishvat-quiz"
  to = "/blog/"
  status = 301

# Hidden for now (Tanya's decision, 2026-11-24). 302 so the URL can come back.
[[redirects]]
  from = "/blog/bar-mitzvah-attractions"
  to = "/blog/"
  status = 302

[[redirects]]
  from = "/blog/hanukkah-quiz"
  to = "/blog/hanukkah-trivia/"
  status = 301

[[redirects]]
  from = "/blog/new-years-eve-at-home"
  to = "/blog/new-years-eve-games/"
  status = 301

[[redirects]]
  from = "/blog/office-holiday-toast"
  to = "/blog/office-christmas-party-games/"
  status = 301

[[redirects]]
  from = "/blog/team-building-day-ideas"
  to = "/blog/team-building-activities-for-work/"
  status = 301

# Hebrew demos belong to heytadam.com; English demos to tadamevents.com.
# Tom is available on both sites. Redirects preserve query strings (e.g. autostart).
# Allowed demo frontends connect directly to the existing gameplay backend.
# Keep the browser URL on this site, including host and phone join routes.
# Request each demo's generated HTML explicitly. Base44's extensionless routes
# return its Hebrew SPA shell, flashing that title before the game JavaScript loads.
[[redirects]]
  from = "/fauda-demo"
  to = "https://heytadam.com/fauda-demo"
  status = 302
  force = true

[[redirects]]
  from = "/fauda-demo/"
  to = "https://heytadam.com/fauda-demo"
  status = 302
  force = true

[[redirects]]
  from = "/cellcom-demo"
  to = "https://heytadam.com/cellcom-demo"
  status = 302
  force = true

[[redirects]]
  from = "/eyal-demo"
  to = "https://heytadam.com/eyal-demo"
  status = 302
  force = true

[[redirects]]
  from = "/noa-demo"
  to = "https://heytadam.com/noa-demo"
  status = 302
  force = true

[[redirects]]
  from = "/base44-demo"
  to = "https://heytadam.com/base44-demo"
  status = 302
  force = true

[[redirects]]
  from = "/tom-demo"
  to = "https://tadam.base44.app/tom-demo/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/friends-demo"
  to = "https://tadam.base44.app/friends-demo/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/the-simpsons-demo"
  to = "https://tadam.base44.app/the-simpsons-demo/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/stranger-things-demo"
  to = "https://tadam.base44.app/stranger-things-demo/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/host/*"
  to = "https://tadam.base44.app/host/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/play/*"
  to = "https://tadam.base44.app/play/:splat"
  status = 200
  force = true

# Game assets come from Base44 so its backup also works during a Worker outage.
# Existing landing-page files (including fonts) take precedence.
[[redirects]]
  from = "/assets/*"
  to = "https://tadam.base44.app/assets/:splat"
  status = 200

[[redirects]]
  from = "/audio/*"
  to = "https://tadam.base44.app/audio/:splat"
  status = 200

[[redirects]]
  from = "/media/*"
  to = "https://tadam.base44.app/media/:splat"
  status = 200

[[redirects]]
  from = "/images/*"
  to = "https://tadam.base44.app/images/:splat"
  status = 200

[[redirects]]
  from = "/fonts/*"
  to = "https://tadam.base44.app/fonts/:splat"
  status = 200
