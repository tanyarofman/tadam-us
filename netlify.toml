[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/brand/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# The site used to have an English copy under /en/; it is English-only at the root now.
[[redirects]]
  from = "/en"
  to = "/"
  status = 301

[[redirects]]
  from = "/en/*"
  to = "/:splat"
  status = 301

# Blog articles removed or renamed for the US site (2026-11-24).
[[redirects]]
  from = "/blog/hanukkah-riddles"
  to = "/blog/"
  status = 301

[[redirects]]
  from = "/blog/tu-bishvat-quiz"
  to = "/blog/"
  status = 301

[[redirects]]
  from = "/blog/team-building-day-ideas"
  to = "/blog/team-building-activities-for-work/"
  status = 301

# Interactive demo frontends; gameplay connects directly to its existing backend.
# Keep the browser URL on this site, including host and phone join routes.
[[redirects]]
  from = "/eyal-demo"
  to = "https://tadam.base44.app/eyal-demo"
  status = 200
  force = true

[[redirects]]
  from = "/noa-demo"
  to = "https://tadam.base44.app/noa-demo"
  status = 200
  force = true

[[redirects]]
  from = "/base44-demo"
  to = "https://tadam.base44.app/base44-demo"
  status = 200
  force = true

[[redirects]]
  from = "/tom-demo"
  to = "https://tadam.base44.app/tom-demo"
  status = 200
  force = true

[[redirects]]
  from = "/friends-demo"
  to = "https://tadam.base44.app/friends-demo"
  status = 200
  force = true

[[redirects]]
  from = "/host/*"
  to = "https://tadam.base44.app/host/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/play/*"
  to = "https://tadam.base44.app/play/:splat"
  status = 200
  force = true

# Game assets come from Base44 so its backup also works during a Worker outage.
# Existing landing-page files (including fonts) take precedence.
[[redirects]]
  from = "/assets/*"
  to = "https://tadam.base44.app/assets/:splat"
  status = 200

[[redirects]]
  from = "/audio/*"
  to = "https://tadam.base44.app/audio/:splat"
  status = 200

[[redirects]]
  from = "/media/*"
  to = "https://tadam.base44.app/media/:splat"
  status = 200

[[redirects]]
  from = "/images/*"
  to = "https://tadam.base44.app/images/:splat"
  status = 200

[[redirects]]
  from = "/fonts/*"
  to = "https://tadam.base44.app/fonts/:splat"
  status = 200
