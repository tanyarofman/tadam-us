<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8">
<style>
@font-face{font-family:Almoni;font-weight:400;src:url(../../public/fonts/almoni-tzar-regular-aaa.otf)}
@font-face{font-family:Almoni;font-weight:700;src:url(../../public/fonts/almoni-tzar-bold-aaa.otf)}
*{margin:0;box-sizing:border-box}html{width:1200px;height:630px;background:#001670;overflow:hidden}
body{position:absolute;left:0;top:0;width:1200px;height:630px;overflow:hidden;font-family:Almoni,Arial,sans-serif;color:#fff;position:relative;
 background:
  radial-gradient(ellipse 120px 520px at 12% 40%,rgba(2,81,253,.9),transparent 70%),
  radial-gradient(ellipse 120px 520px at 50% 40%,rgba(2,81,253,.9),transparent 70%),
  radial-gradient(ellipse 120px 520px at 88% 40%,rgba(2,81,253,.9),transparent 70%),
  linear-gradient(180deg,#001670 0%,#003ede 55%,#0047f2 100%)}
.floor{position:absolute;left:0;right:0;bottom:0;height:120px;background:linear-gradient(180deg,#0d2696,#030e3f)}
.floor::before{content:"";position:absolute;left:-5%;right:-5%;top:-6px;height:12px;border-radius:50%;
 background:radial-gradient(ellipse at center,#fff 0%,#ffe9a8 40%,transparent 75%);filter:blur(2px)}
.logo{position:absolute;left:60px;top:95px;width:440px;filter:drop-shadow(0 20px 40px rgba(0,0,0,.45))}
.text{position:absolute;right:70px;top:70px;width:600px}
h1{font-size:84px;line-height:1.05;font-weight:700;color:#ffe600;text-shadow:0 6px 0 rgba(0,22,112,.5)}
p{margin-top:20px;font-size:32px;line-height:1.3;font-weight:400}
.pill{position:absolute;right:70px;bottom:150px;background:#ffe600;color:#00176a;font-weight:700;font-size:34px;
 padding:10px 34px 14px;border-radius:999px;box-shadow:0 8px 0 rgba(0,22,112,.4)}
.url{position:absolute;left:80px;bottom:38px;font:700 26px Arial,sans-serif;direction:ltr;opacity:.85}
</style></head><body>
<div class="floor"></div>
<img class="logo" src="../../public/brand/tadam-logo-v2.png" alt="">
<div class="text"><h1>הרגע שכולם יזכרו מהאירוע.</h1>
<p>משחק טריוויה חי על החוגג.ת שלכם, שנבנה מהסיפורים של המשפחה והחברים.</p></div>
<div class="pill">בואו לראות דמו</div>
<div class="url">tadam-game.netlify.app</div>
</body></html>
